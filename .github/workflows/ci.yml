name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install -p .venv/bin/python -e ".[dev]"
      - run: .venv/bin/ruff check app tests alembic
      - run: .venv/bin/python -m pytest -q
      - name: Alembic migration applies on SQLite
        run: mkdir -p data && .venv/bin/alembic upgrade head

  domain:
    name: Domain package (vitest + tsc)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/domain } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/domain/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile app (tsc)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
