[project]
name = "eodisan-api"
version = "0.1.0"
description = "어디산(Eodisan) API — 제품 원산지·성분·회수 정보 서버"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "pyjwt>=2.9",
  "cryptography>=43",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5"]
ml = ["onnxruntime>=1.18", "numpy>=1.26"]
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 의 Depends()/Query() 기본값 패턴은 의도된 것

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
