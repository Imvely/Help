  - {name_ko: 구연산, name_en: Citric acid, e_number: E330, functions: [산도조절제], synonyms: [구연산(산도조절제)], hazard: {grade: 0, evidence: regulatory, regulatory_status: {KR: 허용, EU: 허용, US: 허용}, groups: [], summary: "과일에도 있는 산. 안전합니다.", sources: ["https://food.ec.europa.eu/food-safety/food-improvement-agents/additives/re-evaluation_en"], reviewed: 2026-10-01}}
